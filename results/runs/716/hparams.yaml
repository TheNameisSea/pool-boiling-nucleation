model_cfg:
  name: filmavit
  params:
    patch_size: 16
    embed_dim: 384
    processor_blocks: 12
    num_heads: 6
    drop_path: 0.2
    attn_scale: true
    feat_scale: true
    num_fluid_params: 9
data_cfg:
  dataset: poolboiling_fc72
  input_fields:
  - dfun
  - temperature
  - velx
  - vely
  output_fields:
  - dfun
  - temperature
  - velx
  - vely
  normalize: none
  downsample_factor: 1
  time_window: 5
  start_time: 100
  return_fluid_params: true
  train_paths:
  - ${data_home}/PoolBoiling-Saturated-FC72-2D/Twall_75.hdf5
  - ${data_home}/PoolBoiling-Saturated-FC72-2D/Twall_76.hdf5
  - ${data_home}/PoolBoiling-Saturated-FC72-2D/Twall_78.hdf5
  - ${data_home}/PoolBoiling-Saturated-FC72-2D/Twall_80.hdf5
  - ${data_home}/PoolBoiling-Saturated-FC72-2D/Twall_82.hdf5
  - ${data_home}/PoolBoiling-Saturated-FC72-2D/Twall_84.hdf5
  - ${data_home}/PoolBoiling-Saturated-FC72-2D/Twall_86.hdf5
  - ${data_home}/PoolBoiling-Saturated-FC72-2D/Twall_88.hdf5
  - ${data_home}/PoolBoiling-Saturated-FC72-2D/Twall_90.hdf5
  - ${data_home}/PoolBoiling-Saturated-FC72-2D/Twall_92.hdf5
  - ${data_home}/PoolBoiling-Saturated-FC72-2D/Twall_94.hdf5
  - ${data_home}/PoolBoiling-Saturated-FC72-2D/Twall_96.hdf5
  - ${data_home}/PoolBoiling-Saturated-FC72-2D/Twall_98.hdf5
  - ${data_home}/PoolBoiling-Saturated-FC72-2D/Twall_100.hdf5
  - ${data_home}/PoolBoiling-Saturated-FC72-2D/Twall_102.hdf5
  - ${data_home}/PoolBoiling-Saturated-FC72-2D/Twall_104.hdf5
  - ${data_home}/PoolBoiling-Saturated-FC72-2D/Twall_106.hdf5
  - ${data_home}/PoolBoiling-Saturated-FC72-2D/Twall_107.hdf5
  val_paths:
  - ${data_home}/PoolBoiling-Saturated-FC72-2D/Twall_91.hdf5
  - ${data_home}/PoolBoiling-Saturated-FC72-2D/Twall_101.hdf5
optim_cfg:
  name: lion
  params:
    lr: 5.0e-05
    weight_decay: 0.1
    use_triton: true
scheduler_cfg:
  name: cosine_warmup
  params:
    warmup_iters: 1000
    eta_min: 1.0e-06
log_wandb: false
normalization_constants:
- velx: 0.0
  temperature: 0.0
  vely: 0.0
  dfun: 0.0
- velx: 1.00000001
  temperature: 1.00000001
  vely: 1.00000001
  dfun: 1.00000001
