# Single-bubble control, unconditioned AViT: upstream's single-bubble split (FC-72 and R-515B,
# 12 training simulations), with ${data_home} paths and return_fluid_params: False.
# Copied into the upstream config tree by setup/get_bubbleformer.sh.
dataset: singlebubble_nocond
input_fields: ["dfun", "temperature", "velx", "vely"]
output_fields: ["dfun", "temperature", "velx", "vely"]
normalize: none
downsample_factor: 1
time_window: 5
start_time: 10
return_fluid_params: False
train_paths:
  - ${data_home}/SingleBubble-Saturated-R515B-2D/Twall_13.hdf5
  - ${data_home}/SingleBubble-Saturated-R515B-2D/Twall_15.hdf5
  - ${data_home}/SingleBubble-Saturated-R515B-2D/Twall_17.hdf5
  - ${data_home}/SingleBubble-Saturated-R515B-2D/Twall_19.hdf5
  - ${data_home}/SingleBubble-Saturated-R515B-2D/Twall_21.hdf5
  - ${data_home}/SingleBubble-Saturated-R515B-2D/Twall_23.hdf5
  - ${data_home}/SingleBubble-Saturated-FC72-2D/Twall_90.hdf5
  - ${data_home}/SingleBubble-Saturated-FC72-2D/Twall_92.hdf5
  - ${data_home}/SingleBubble-Saturated-FC72-2D/Twall_94.hdf5
  - ${data_home}/SingleBubble-Saturated-FC72-2D/Twall_96.hdf5
  - ${data_home}/SingleBubble-Saturated-FC72-2D/Twall_98.hdf5
  - ${data_home}/SingleBubble-Saturated-FC72-2D/Twall_100.hdf5
val_paths:
  - ${data_home}/SingleBubble-Saturated-FC72-2D/Twall_91.hdf5
  - ${data_home}/SingleBubble-Saturated-R515B-2D/Twall_14.hdf5
